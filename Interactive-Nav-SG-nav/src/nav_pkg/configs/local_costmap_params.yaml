local_costmap:
   global_frame: tf_frame_odom
   robot_base_frame: tf_frame_base_link
   static_map: false
   rolling_window: true
   width: 4.0
   height: 4.0
   update_frequency: 5.0
   publish_frequency: 5.0
   always_send_full_costmap: true
   transform_tolerance: 2.0
   resolution: 0.05

   plugins:
     - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
     - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

   obstacle_layer:
     observation_sources: local_obstacles
     obstacle_range: 4.0
     raytrace_range: 4.0
     track_unknown_space: false
     local_obstacles:
       data_type: PointCloud2
       topic: /filtered_pointcloud
       sensor_frame: tf_frame_base_link
       marking: true
       clearing: true
       observation_queue_size: 10
       tf_filter_tolerance: 0.10
       max_observation_age: 0.0
       expected_update_rate: 0.0
       # Retain the latest simulator-step cloud across the local costmap update
       # cycles between sensor frames.  Door-specific clearing must not shorten
       # this below the actual point-cloud interval, otherwise the obstacle
       # layer repeatedly runs without an observation.
       # The organized-depth stream can be ~1.1--1.5 s apart under six-way
       # simulation load. Keep the last cloud long enough to bridge that gap,
       # while the semantic door overlay remains responsible for explicit
       # post-open clearing.
       observation_persistence: 1.0
       max_obstacle_height: 1.85
       min_obstacle_height: 0.05

   inflation_layer:
     # Keep the stable local-planner clearance while the global layer carries
     # the separately requested 0.45 m inflation experiment.
     inflation_radius: 0.50
     cost_scaling_factor: 10.0
   
