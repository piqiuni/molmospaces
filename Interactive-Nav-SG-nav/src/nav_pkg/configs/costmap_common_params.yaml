robot_radius: 0.3
obstacle_range: 15.0
raytrace_range: 15.0
observation_sources: RGBD_camera
RGBD_camera: {
  data_type: PointCloud2,
  topic: /registered_scan, 
  marking: true, 
  clearing: true,
  max_obstacle_height: 1.5,
  min_obstacle_height: 0.2
  }
inflation_radius: 0.6    # 必须足够大！
cost_scaling_factor: 10.0  