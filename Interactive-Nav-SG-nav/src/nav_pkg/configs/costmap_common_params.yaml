robot_radius: 0.30
obstacle_range: 15.0
raytrace_range: 15.0
observation_sources: RGBD_camera
RGBD_camera: {
  data_type: PointCloud2,
  topic: /registered_scan, 
  sensor_frame: tf_frame_lidar,
  marking: true, 
  clearing: true,
  observation_queue_size: 5,
  tf_filter_tolerance: 0.05,
  max_observation_age: 0.0,
  expected_update_rate: 0.0,
  observation_persistence: 0.5,
  max_obstacle_height: 1.5,
  min_obstacle_height: 0.05
  }
inflation_radius: 0.4
cost_scaling_factor: 10.0  
