#!/usr/bin/env python3

PACKAGE = "nav_pkg"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

generator = ParameterGenerator()
generator.add("xy_goal_tolerance", double_t, 0, "Terminal position tolerance", 0.25, 0.01, 1.0)
generator.add("yaw_goal_tolerance", double_t, 0, "Terminal heading tolerance", 0.20, 0.01, 3.14)

exit(generator.generate(PACKAGE, "nav_pkg", "PathFollower"))
