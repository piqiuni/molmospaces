# 占据地图配置参数

# 地图尺寸
map_size_x: 100.0  # 米
map_size_y: 100.0  # 米
resolution: 0.05   # 米/格子

# 地图原点（相对于世界坐标系）
origin_x: 0.0
origin_y: 0.0

# 概率参数
P_occ: 0.7    # 占据概率
P_free: 0.3   # 自由概率
P_prior: 0.5  # 先验概率

# 点云处理参数
max_range: 15.0        # 最大有效距离（米）
min_range: 0.1         # 最小有效距离（米）
z_min: 0.0             # 最小高度（米）- 绝对高度模式使用
z_max: 2.0             # 最大高度（米）- 绝对高度模式使用
voxel_size: 0.05       # 体素滤波尺寸（米）

# Habitat风格相对高度过滤参数
use_relative_height: true    # 启用相对高度过滤（true=Habitat风格，false=绝对高度）
robot_height: 1            # 机器人相对高度偏移（米）
z_threshold: 0.2             # 相对高度容差（米）

# 概率更新增强
prob_enhance_factor: 1.05    # 概率增强因子（加速地图收敛）

# 更新频率
update_rate: 5  # Hz

# 发布参数
publish_map: true
publish_rate: 2  # Hz

