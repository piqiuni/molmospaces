# 地图更新间隔
map_update_interval: 0.5
reset_topic: "/nav_system/reset"
odom_topic: "/odom"
scan_filter_queue_size: 1

# GMapping核心参数
use_odom_pose_for_mapping: true  # 仿真 odom 为真值；禁止 scan matching 旋转/平移地图
# Hybrid scan matching: trust fused odom/IMU yaw and only allow bounded
# translation correction. This prevents false angular matches from rotating
# successive scans into different map orientations.
scan_matching_lock_yaw_to_odom: true
scan_matching_max_translation_correction: 0.15
maxUrange: 7.9 # RGB-D伪激光的可靠二维清除距离
sigma: 0.05
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0 #新测量的权重
lskip: 1 #跳过某些激光束

# 运动模型参数（仿真里程计精准，大幅降低噪声）
srr: 0.001  # 平移→平移噪声，原0.2降至0.01
srt: 0.002  # 平移→旋转噪声，原0.4降至0.02  
str: 0.001  # 旋转→平移噪声，原0.2降至0.01
stt: 0.002  # 旋转→旋转噪声，原0.4降至0.02

# 地图更新阈值
linearUpdate: 0.5
angularUpdate: 0.2
temporalUpdate: 1.0
resampleThreshold: 0.5

# 粒子滤波参数（里程计准确时可以用更少粒子）
particles: 10   # 原30，减少到10节省计算

# 地图范围
xmin: -100.0
ymin: -100.0
xmax: 100.0
ymax: 100.0
#分辨率
delta: 0.1 

# 采样参数
llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005

# 点云高度滤波参数
enable_height_filter: true
filter_height_center: 0.95
filter_height_tolerance: 0.9
filter_height_frame: tf_frame_base_link
pointcloud_scan_range_max: 8.0
pointcloud_scan_angle_increment_deg: 1.0
pointcloud_scan_height_min: 0.05
pointcloud_scan_height_max: 1.85
pointcloud_scan_min_points_per_beam: 3
pointcloud_scan_support_bins: 2
pointcloud_scan_min_support_neighbors: 1
pointcloud_scan_support_range_tolerance: 0.40
pointcloud_scan_neighbor_bins: 1
pointcloud_scan_max_range_jump: 0.75

# 障碍物膨胀参数
enable_obstacle_inflation: true
inflation_radius: 0.10  # 膨胀半径（米）
inscribed_radius: 0.05  # 障碍物核心区域

# 局部覆写参数（用最新扫描实时覆盖机器人附近区域）
enable_local_overwrite: false
local_overwrite_radius: 8.0
local_overwrite_mark_occupied: false
local_overwrite_clear_confirm_count: 3
local_overwrite_occupy_confirm_count: 3
local_overwrite_ttl_sec: 10.0
local_overwrite_clear_static_occupied: true
local_overwrite_reset_on_correction_trans_delta: 0.25
local_overwrite_reset_on_correction_rot_delta: 0.10

# 时间同步保护（避免 odom 与 pointcloud 时间错配）
enable_time_sync_guard: true
max_odom_cloud_time_diff: 0.03
max_cloud_age_sec: 0.35
enforce_cloud_age_drop: false
odom_stamp_buffer_size: 200
