# Voronoi Mapping Node 配置参数

# 更新频率（Hz）
# 控制节点主循环频率，实际更新由地图消息触发
update_rate: 5.0

# 是否发布Voronoi骨架线的可视化Marker
# true: 发布红色线段到 //struct_mapping/voronoi_markers 供RViz显示
visualize_voronoi: true

# 是否发布距离图
# true: 发布到 /distance_map
publish_distance_map: true

# Voronoi图裁剪迭代次数
# 0: 不裁剪，保留完整Voronoi图（端点非常多）
# 1-2: 轻度裁剪（仍有较多端点）
# 3-5: 中度裁剪（适中，推荐）
# 6-10: 重度裁剪（只保留主干）
prune_iterations: 1

# 障碍物距离阈值（单位：grid cells）
# 控制Voronoi点生成时两个障碍物之间的最小距离阈值
# 较小的值（如1-2）：允许在更接近的障碍物之间生成Voronoi点，可能产生更多平行线
# 较大的值（如3-5）：只在距离较远的障碍物之间生成Voronoi点，可能减少平行线
# 默认值：1
obstacle_distance_threshold: 4
