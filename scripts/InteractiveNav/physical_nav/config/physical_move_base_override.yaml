# Physical-only move_base overrides. Loaded inside the /move_base private
# namespace after the shared navigation defaults, leaving simulator settings
# unchanged.
# move_base's outer controller loop controls how often the planner command is
# emitted. Keep it at the same 10 Hz as the physical command/safety bridge;
# changing only DWAPlannerROS/controller_frequency leaves the outer loop at 5 Hz.
controller_frequency: 10.0

DWAPlannerROS:
  # The physical command bridge and safety limiter run at 10 Hz.  A 5-Hz DWA
  # loop produces visible 200-ms command steps and makes recovery oscillation
  # look like stop-go motion.
  controller_frequency: 10.0
  # The planner must be able to accelerate from rest inside one 10-Hz DWA
  # window.  The physical minimum speed is applied downstream by
  # physical_velocity_safety; do not duplicate that floor here.
  max_vel_x: 0.56
  min_vel_x: 0.05
  max_vel_trans: 0.60
  min_vel_trans: 0.05
  max_vel_theta: 1.30
  # Keep DWA angular sampling independent from the physical minimum-turn
  # mapping, which is applied by physical_velocity_safety only for non-zero
  # commands.  A low planner floor avoids eliminating gentle curved paths.
  min_vel_theta: 0.05
  # The shared DWA default (0.1 m/s^2) is appropriate for a very conservative
  # simulator profile, but at a 10 Hz physical loop it leaves only a 0.01 m/s
  # translational dynamic window per cycle.  The planner then frequently
  # selects angular-only samples even when the local path is forward.  This
  # value remains below the Go2 safety limiter's 0.60 m/s cap and lets the
  # window open quickly enough for normal forward tracking.
  acc_lim_trans: 1.0
  # If the next path segment is behind the base, rotate in place first. This
  # uses DWA's collision-checked zero-vx trajectory instead of trying to
  # reach a rear waypoint with a forward arc (which becomes a circle after
  # the physical velocity limiter is applied).
  rear_path_prerotate_enabled: true
  # Enter the in-place branch for ordinary 90-degree hallway/door turns too;
  # the shared 1.75-rad rear-path threshold is too late for the physical base.
  rear_path_enter_angle: 1.00
  rear_path_exit_angle: 0.20
  rear_path_rotate_speed: 0.40
  # A temporary forced reverse after three failed samples changes the sign of
  # vx abruptly and is unsafe on the long camera mast. Let move_base stop and
  # replan instead; valid reverse trajectories remain available through DWA's
  # normal velocity window when explicitly requested by the global path.
  conditional_reverse_enabled: false
  # The downstream safety deadband handles tiny residual commands without
  # converting a valid curved-path correction into a planner failure/stop.
  # Treat a near-zero local command as a planner failure while a path is
  # active, so the executor can replan instead of appearing stuck.
  reject_degenerate_cmd_enabled: true
  degenerate_cmd_min_trans: 0.02
  degenerate_cmd_min_rot: 0.08
  xy_goal_tolerance: 0.30
  # Require a tighter terminal heading on the physical base. The velocity
  # safety layer now preserves the low angular speeds needed to reach it.
  yaw_goal_tolerance: 0.15

GlobalPlanner:
  # Exploration and post-interaction planning must be able to cross cells
  # that have not been observed yet. Lethal obstacle cells remain blocked;
  # only the NO_INFORMATION value is made traversable by the global planner.
  allow_unknown: true

local_costmap:
  rolling_window: true
  width: 8.0
  height: 8.0
  resolution: 0.05
  # Costmap2DROS mirrors these top-level values into the obstacle plugin at
  # runtime, so override both levels to prevent the shared 15 m default from
  # replacing the physical window-specific range.
  obstacle_range: 8.0
  raytrace_range: 8.0
  obstacle_layer:
    obstacle_range: 8.0
    raytrace_range: 8.0
    footprint_clearing_enabled: true
    # A forward RGB-D camera cannot ray-clear surfaces that leave its field of
    # view. Rebuild only this rolling, real-time layer from the newest cloud at
    # a bounded interval; the persistent/global occupancy map is untouched.
    obstacle_reset_interval: 2.0
    local_obstacles:
      # ObstacleLayer does not expire cells when this duration elapses: it
      # retains old clouds and re-marks their endpoints.  Consume only the
      # newest RGB-D cloud so depth jitter cannot be replayed as ghost walls.
      observation_persistence: 0.0
      # Do not re-inject a delayed frame after a Wi-Fi/WebSocket stall.  A
      # subsequent fresh cloud provides the clearing rays for observed space.
      max_observation_age: 0.5
      marking: true
      clearing: true
  inflation_layer:
    inflation_radius: 0.40
    cost_scaling_factor: 8.0

global_costmap:
  inflation_layer:
    inflation_radius: 0.40
    cost_scaling_factor: 8.0
