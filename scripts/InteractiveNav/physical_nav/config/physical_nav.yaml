# ROS1 parameters for the Go2/D435i physical platform.  This file is loaded
# only by physical_nav_readonly.launch; simulator defaults remain untouched.
frames:
  world_frame: "tf_frame_map"
  base_frame: "tf_frame_base_link"
  camera_frame: "d435i_color_optical_frame"

camera:
  color_width: 1280
  color_height: 720
  color_fps: 10
  depth_width: 848
  depth_height: 480
  depth_fps: 10
  align_to: "depth"

topics:
  rgb_image: "/physical_nav/rgb/image_raw"
  depth_image: "/physical_nav/depth/image_raw"
  camera_info: "/physical_nav/camera_info"
  depth_camera_info: "/physical_nav/depth_camera_info"
  pointcloud: "/physical_nav/points"
  occupancy_grid: "/physical_nav/occupancy"
  room_context: "/physical_nav/room_context"
  object_detections: "/physical_nav/detections"
  tracked_detections: "/physical_nav/tracked_detections"
  object_map: "/physical_nav/object_map"
  object_markers: "/physical_nav/object_markers"
  scene_id_grid: "/physical_nav/scene_id_grid"
  scene_confidence_grid: "/physical_nav/scene_confidence_grid"
  room_segment_grid: "/physical_nav/room_segment_grid"
  unified_graph: "/physical_nav/unified_graph"
  unified_graph_markers: "/physical_nav/unified_graph_markers"
  unified_graph_markers_lifted: "/physical_nav/unified_graph_markers_lifted"
  navigation_hints: "/physical_nav/navigation_hints"
  interaction_command: "/physical_nav/interaction_command"
  interaction_result: "/physical_nav/interaction_result"
  attribute_updates: "/physical_nav/attribute_updates"
  attribute_refresh_requests: "/physical_nav/attribute_refresh_requests"
  attribute_inference_status: "/physical_nav/attribute_inference_status"
  room_attribute_requests: "/physical_nav/room_attribute_requests"
  room_attribute_updates: "/physical_nav/room_attribute_updates"

object_detection:
  backend: "yoloe_pf_box3d"
  provider: "yoloe_local"
  model_path: "/home/user/ldl/molmospaces/detection_models/yoloe/weights/yoloe-26l-seg-pf.pt"
  device: "cuda:0"
  imgsz: 640
  # Physical-platform operating threshold. Structural/raw label filters below
  # remain active, and max_detections still bounds load.
  confidence_threshold: 0.20
  class_confidence_thresholds:
    door: 0.10
    portal: 0.10
    fridge: 0.40
    refrigerator: 0.40
  # Fridge is visually confused with small cabinets and large wall panels in
  # the current physical room. Require a useful image footprint and plausible
  # lifted dimensions before it can enter tracking or the interaction graph.
  class_plausibility:
    fridge:
      min_bbox_area_px: 3000
      min_bbox_side_px: 35
      min_height_m: 1.40
      max_height_m: 1.90
      max_horizontal_span_m: 1.80
      max_volume_m3: 4.00
  iou_threshold: 0.7
  max_detections: 50
  # Applied to raw YOLOE labels before mask point-cloud lifting and 3D boxes.
  detection_filter:
    enabled: true
    excluded_raw_labels:
      # Dataset-style scene labels are not navigation objects. In particular,
      # ``sunday`` is a frequent false semantic label for wall/furniture and
      # must never enter the interaction graph.
      - sunday
      # A door handle is part of the full door, not a second interaction
      # object. YOLOE commonly emits both boxes in the same frame.
      - door_handle
      # Door hardware is not a navigable portal. YOLOE may emit either the
      # canonical ``deadbolt`` label or the common ``deadbelt`` typo.
      - deadbolt
      - dead_bolt
      - deadbelt
      - mirror
      - bathroom_mirror
      - vanity_mirror
      - wall_mirror
      - lamp
      - lamp_shade
      - ceiling_light
      - ceiling_lamp
      - chandelier
      - pendant_light
      - light_fixture
      - downlight
      - spotlight
      - ceiling_fixture
      - lighting
      # Place/structure masks are scene evidence, not object instances. If
      # fused as tracks, their floor/wall masks grow into multi-metre boxes.
      - floor
      - ground
      - wall
      - ceiling
      - beam
      - atrium
      - courtyard
      - basement
      - hall
      - gallery
      - server_room
      - wine_cellar
      - hotel_lobby
      - hospital_room
      - bank_vault
      - ktv
      - extrude
      - extruded
      - extrusion
      # Floor coverings produce broad, near-ground masks and should not
      # become persistent object tracks in the physical semantic map.
      - carpet
      - rug
      - area_rug
      - floor_mat
      - doormat
    excluded_semantic_labels: []
    # YOLOE PF can return open-vocabulary compound place/structure labels
    # such as wood_wall, airport_terminal or train_interior. Exact matching
    # above cannot catch those variants, so the physical worker also rejects
    # these normalized label tokens before any 3D lifting/tracking occurs.
    excluded_label_tokens:
      - lighting
      - wall
      - floor
      - ground
      - ceiling
      - beam
      - hallway
      - corridor
      - lobby
      - interior
      - room
      - kitchen
      - restaurant
      - airport
      - terminal
      - elevator
      - shaft
      - winery
      - gallery
      - atrium
      - basement
      - courtyard
      - building
      - physics_laboratory
      - stormy
      - carpet
      - rug
      - mat
    aliases:
      exit: door
      exit_door: door
  publish_rate: 10.0
  max_sync_slop_sec: 0.08
  process_each_stamp_once: true
  skip_if_busy: true
  point_stride: 6
  max_depth_m: 8.0
  min_valid_points: 12
  mask_component_min_area: 48
  # One inlier definition drives the displayed 2-D Seg, 3-D Seg and Box.
  # Preserve all supported mask components; remove only invalid/extreme depth.
  drop_bottom_ratio: 0.0
  depth_band_lower_quantile: 0.02
  depth_band_upper_quantile: 0.98
  # Planar interaction targets use a robust depth band to reject background
  # leakage while preserving the complete door/portal surface in 2-D and 3-D.
  planar_semantic_labels: [door, portal]
  planar_depth_min_tolerance_m: 0.10
  cluster_eps: 0.18
  cluster_min_points: 12
  bbox_quantile_lower: 0.02
  bbox_quantile_upper: 0.98
  # 2-D connected components already reject tiny islands. Disabling the old
  # 3-D centroid crop preserves elongated and disconnected object surfaces.
  enable_euclidean_cluster: false
  reject_low_mean_height: true
  min_mean_height_m: 0.08
  ground_reject_min_xy_span: 1.20
  ground_reject_max_height: 0.40
  ground_reject_max_center_z: 0.25
  max_noninteraction_box_span_m: 2.50
  max_noninteraction_box_volume_m3: 4.00
  projection_frame_id: "tf_frame_map"
  publish_debug_markers: true
  publish_debug_segmented_cloud: false
  publish_debug_detection_image: true
  publish_debug_world_markers: true
  publish_debug_world_segmented_cloud: false
  # Exact-frame instance points for RViz only. Keep the local HTTP/ROS debug
  # payload bounded; future multi-view fusion will maintain a voxel map.
  debug_cloud_max_points_per_instance: 400
  # RViz/Foxglove-only world-box association. Raw detections and semantic-map
  # tracking are unchanged. Two receipts confirm a display track, EMA reduces
  # RGB-D/pose jitter, and a short hold bridges intermittent YOLO misses.
  debug_box_min_confirmations: 2
  # The segmented cloud is latest-frame data.  Keep the visualization box at
  # the same position; persistence is still provided by the track hold below.
  debug_box_smoothing_alpha: 1.0
  debug_box_match_distance_m: 0.60
  debug_box_hold_s: 3.0
  debug_overlay_jpeg_quality: 92
  debug_marker_topic: "/physical_nav/boxes_3d"
  debug_segmented_cloud_topic: "/physical_nav/segmented_cloud"
  debug_detection_image_topic: "/physical_nav/detections_overlay"
  debug_world_marker_topic: "/physical_nav/boxes_3d_world"
  debug_world_segmented_cloud_topic: "/physical_nav/segmented_cloud_world"

semantic_map:
  enable_object_mapping: true
  enable_scene_mapping: true
  subscribe_pointcloud: true
  # Keep an object track through occlusions. Once a door/container has two
  # detector frames plus a valid M1 result, both the semantic map and graph
  # latch its identity indefinitely; visibility is represented separately.
  # Unconfirmed detector-only tracks remain reclaimable after this timeout.
  object_stale_after_sec: 30.0
  # Fuse/publish the latest RGB-D/YOLO result at 10 Hz. Navigation consumes
  # these receipts at its independent 5 Hz logical step.
  publish_rate: 10.0
  # Require two temporally consecutive observations before inserting an
  # object into the persistent semantic map. Detection confidence is kept
  # unchanged here; this is a temporal confirmation gate only.
  object_min_confirmations: 2
  # Interaction classes must be present in two uninterrupted detector
  # receipts. A missed frame resets the streak for both doors and fridges.
  object_class_min_confirmations:
    door: 2
    portal: 2
    fridge: 2
    refrigerator: 2
    # YOLOE may call a refrigerator a locker. Keep it as a locker hypothesis
    # until M1 confirms it; two identical M1 answers finalize the class.
    locker: 2
  # Use the highest world-Z point, not visible box height: close-range boxes
  # may contain only the visible part of a real door or refrigerator.
  object_class_min_top_height_m:
    # Door boxes are frequently clipped by the image border; the observed
    # point-cloud top is therefore lower than the physical door top.
    door: 1.40
    portal: 1.40
    fridge: 1.40
    refrigerator: 1.40
  # Merge split historical tracks only when their latest image boxes are
  # nearly identical and their stable 3D boxes overlap. Distinct adjacent
  # objects remain separate even when their 3D centers are close.
  object_duplicate_bbox_iou_threshold: 0.85
  object_duplicate_3d_overlap_threshold: 0.15
  # Associate the same physical door across viewpoints using its unoriented
  # long axis and 3-D interval overlap. This does not merge adjacent doors on
  # the same wall when their long-axis intervals do not overlap.
  object_portal_cross_view_match_enabled: true
  object_portal_cross_view_normal_distance_m: 0.45
  # PCA/OBB can flip a planar door by 90 degrees between adjacent frames.
  # Association accepts that flip; the display tracker keeps one stable axis.
  object_portal_cross_view_yaw_tolerance_rad: 1.57
  object_portal_cross_view_min_tangent_overlap_ratio: 0.20
  object_portal_cross_view_min_vertical_overlap_ratio: 0.35
  # Per-class confirmation remains enforced by object_class_min_confirmations.
  # A single detector receipt is insufficient for semantic interaction graph
  # admission; require two observations before exposing the object downstream.
  graph_min_observations: 2
  # After a confirmed refrigerator open, newly exposed contents may only be
  # visible for one detector frame.  Admit those currently visible tentative
  # tracks to the semantic graph only; the strict tracked-detection topic used
  # by M1 remains governed by the three-frame interaction confirmation above.
  open_refrigerator_content_mapping_enabled: true
  open_refrigerator_content_min_observations: 1
  open_refrigerator_content_ignore_class_confirmations: true
  room_segment_use_semantic_overlay: true
  room_portal_cut_enabled: true
  graph_save_path: ""

room_inference:
  backend: "object_rules"

# Module 1 uses image evidence only for physical interaction objects. Room
# semantics stay on deterministic object rules to avoid unrelated VLM calls.
attribute_inference:
  visual_evidence_max_side_px: 1024
  targeted_refresh_priority: 1000.0
  targeted_multiview_max_images: 2
  targeted_multiview_min_step_gap: 8
  targeted_multiview_min_position_gap_m: 0.25
  targeted_multiview_min_yaw_gap_rad: 0.25
  target_bbox_mask_containment_required: true

velocity_safety:
  input_topic: "/physical_nav/shadow_cmd_vel"
  output_topic: "/physical_nav/actuated_cmd_vel"
  scale: 1.0
  max_linear_mps: 0.60
  # Keep the physical base above its static-friction threshold. Explicit zero
  # commands still stop immediately in VelocitySafetyLimiter.stop()/limit().
  min_linear_mps: 0.30
  # A non-zero turn must have enough authority to overcome the Go2 drivetrain
  # dead zone; the deadband below still removes tiny numerical yaw residues.
  linear_deadband_mps: 0.05
  max_angular_rps: 1.30
  min_angular_rps: 0.40
  # Applied only to pure in-place rotations. Moving commands preserve their
  # DWA curvature in velocity_safety.py, so this floor cannot turn an arc into
  # a tight circle.
  angular_deadband_rps: 0.05
  # Keep a bounded one-second ramp to the 0.60 m/s cap without adding the
  # multi-second lag caused by the previous 0.15 m/s^2 limit.
  max_linear_accel_mps2: 0.60
  max_angular_accel_rps2: 2.00
  stale_after_s: 0.50

interaction_policy:
  profile: "physical_human"
  command_topic: "/physical_nav/interaction_command"
  result_topic: "/physical_nav/interaction_result"
  speech_topic: "/physical_nav/speech_request"
  speech_status_topic: "/physical_nav/speech_status"
  mllm_events_topic: "/physical_nav/mllm_events"
  stable_open_s: 3.0
  m3_sample_period_s: 1.0
  m3_min_confidence: 0.60
  # Physical actions include speech playback and the operator's motion.  Keep
  # M3 alive long enough to collect several post-speech observations.
  interaction_timeout_s: 15.0
  temporary_skip_s: 30.0
  # This includes cached AudioHub playback. M3's 10-second window starts only
  # after the Go2 bridge reports the final completed status.
  speech_ack_timeout_s: 30.0
  # The local navigation graph can select an already-nearby door while the
  # remote Go2 speech/control bridge is still reconnecting after a restart.
  # Keep the interaction in its human-assist phase instead of immediately
  # turning that transport startup race into a failed door action.
  speech_subscriber_wait_s: 60.0
  speech_retry_count: 2
  speech_retry_interval_s: 12.0

room_mllm:
  # Physical room attributes are inferred by the M1 room worker.  Keep the
  # latest-only queue so room classification cannot block OCC/room-grid flow.
  enabled: true
  worker_count: 1
  max_queue_size: 2
  # Room-level M1 is an expensive semantic refresh.  A latest-only queue is
  # still retained, but do not admit more than one new room analysis per
  # second; OCC, room-grid publication and object M1 remain unaffected.
  min_interval_s: 5.0

semantic_occ_overlay:
  enabled: true

physical_nav:
  read_only: true
  web_host: "0.0.0.0"
  web_port: 8765
  sensor_ws_host: "0.0.0.0"
  sensor_ws_port: 12334
  qwen_url: "http://127.0.0.1:18080/v1"
  qwen_model: "qwen3.6-35b-a3b-fp8"
  qwen_auto_interval: 0.0
  consistency_topic: "/physical_nav/consistency"
