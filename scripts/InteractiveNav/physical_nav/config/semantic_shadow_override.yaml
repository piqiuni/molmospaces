# Physical read-only shadow lane: enable the complete M2 model policy while
# all action topics remain remapped to unconsumed /physical_nav/shadow_* names.
ablation:
  module1: "dynamic_mllm"
  module2: "mllm_score"
startup_scan:
  enabled: false
model:
  mode: "http"
  endpoint: "http://127.0.0.1:18080/v1"
  model: "qwen3.6-35b-a3b-fp8"
  protocol: "openai_chat"
  timeout_s: 20.0
  max_tokens: 256
  metrics_path: "/tmp/physical_nav_mllm.jsonl"
