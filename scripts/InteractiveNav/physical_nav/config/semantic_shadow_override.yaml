# Physical read-only shadow lane: enable the complete M2 model policy while
# all action topics remain remapped to unconsumed /physical_nav/shadow_* names.
ablation:
  module1: "dynamic_mllm"
  module2: "mllm_score"
startup_scan:
  enabled: false
candidate:
  # The candidate node normalizes portal -> door and cabinet/drawer variants
  # -> drawer_cabinet. Keep all three classes in the graph/candidate display.
  interaction_semantic_types: ["door", "fridge", "drawer_cabinet"]
  # Only doors and refrigerators may be selected as physical interaction
  # subgoals in phase 1.
  subgoal_interaction_semantic_types: ["door", "fridge"]
model:
  mode: "http"
  endpoint: "http://127.0.0.1:18080/v1"
  model: "qwen3.6-35b-a3b-fp8"
  protocol: "openai_chat"
  timeout_s: 20.0
  max_tokens: 256
  metrics_path: "/tmp/physical_nav_mllm.jsonl"
  subgoal_interaction_semantic_types: ["door", "fridge"]
