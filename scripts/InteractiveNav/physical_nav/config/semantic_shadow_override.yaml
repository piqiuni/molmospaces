# Physical read-only shadow lane: enable the complete M2 model policy while
# all action topics remain remapped to unconsumed /physical_nav/shadow_* names.
topics:
  # Explicit base stop works even if the semantic turn/recovery lease is idle.
  base_stop: "/physical_nav/base_stop"
ablation:
  module1: "dynamic_mllm"
  module2: "mllm_score"
  module3: "external_mllm_verified"
startup_scan:
  enabled: false
candidate:
  # The physical interaction graph and subgoal pool intentionally expose only
  # doors and refrigerators. ``locker`` is only a provisional detector
  # hypothesis; it cannot become an interaction candidate until the graph has
  # two detector observations and a valid M1 result. Cabinets and drawers
  # remain ordinary perception evidence.
  interaction_semantic_types: ["door", "fridge", "refrigerator", "locker"]
  subgoal_interaction_semantic_types: ["door", "fridge", "refrigerator", "locker"]
  # Door distances are measured from the door surface, not from its center.
  # The generic interaction safety margin below is intentionally not added to
  # portal poses.  Keep the three physical fallbacks ordered far to near:
  # 1.0, 0.9, 0.8 m.
  portal_standoff_m: 1.00
  # If the costmap shows an obstacle too close to the generated door pose,
  # shift the pose along the nearest occupied-cell outward normal in 0.10 m
  # increments (the door normal is only the fallback when no cell vector is
  # available).
  portal_obstacle_clearance_m: 0.30
  portal_obstacle_push_step_m: 0.10
  portal_obstacle_push_max_m: 0.60
  portal_approach_standoff_offsets_m: [0.0, -0.10, -0.20]
  # A door interaction pose must lie on the door normal: the robot approaches
  # perpendicular to the door's long edge and stops on its centerline.  The
  # old +/-0.20 m tangent fallbacks produced poses diagonally offset along the
  # door, which is unsuitable for the physical opening action.
  portal_approach_tangent_offsets_m: [0.0]
  portal_approach_yaw_offsets_rad: [0.0]
  # The interaction stance must remain on the robot/camera side of the door.
  # If that side is blocked, reject/skip it instead of trying a pose through
  # the closed door on the opposite side.
  portal_opposite_side_fallback_enabled: false
  # Never guess a map-X/Y door normal. Wait for the stable rotated OBB yaw;
  # otherwise the guessed stance can lie along the wall or inside it.
  portal_require_reference_yaw: true
  # Confirmed doors are persistent interaction subgoals. Temporary camera
  # occlusion must not remove them from the candidate pool.
  portal_require_current_visibility: false
  # Retain the initially observed robot side until the base is at least 0.5 m
  # beyond the door plane; this keeps the old valid stance from disappearing
  # due to near-plane pose/OBB jitter.
  portal_side_hysteresis_m: 0.50
  # Do not discard all door stances merely because the physical OCC contains
  # unknown cells. Navigation/costmap safety checks remain authoritative.
  portal_goal_require_known_free: false
  portal_goal_known_free_radius_m: 0.30
  portal_goal_occupied_threshold: 50
  # Cheap candidate-level OCC segment/endpoint preflight.  This physical-only
  # guard rejects known occupied or out-of-bounds options before make_plan;
  # unknown cells are retained and still go through the authoritative planner.
  # Simulator/replay defaults remain disabled in the candidate node itself.
  candidate_occupancy_preflight_enabled: true
  candidate_occupancy_reject_occupied: true
  candidate_occupancy_sample_step_m: 0.10
  candidate_occupancy_start_ignore_m: 0.35
  candidate_occupancy_endpoint_radius_m: 0.25
  candidate_occupancy_threshold: 50
  # Validate body clearance along every anchor route locally. The historical
  # astar switch enables shared Dijkstra for batches (A* for single queries).
  # The expansion cap is shared by the batch; no per-anchor make_plan RPC.
  candidate_occupancy_use_astar: true
  candidate_occupancy_astar_max_expansions: 12000
  # Never apply the cheap OCC hard filter to a map/odom pair older than this;
  # the authoritative planner remains responsible for the final check.
  candidate_occupancy_max_pair_age_s: 0.50
  # The traversal endpoint must clear the full door AABB, Go2 footprint and
  # inflation margin rather than merely sit a fixed distance from its center.
  portal_traversal_clearance_margin_m: 0.55
  # Increase the refrigerator interaction clearance by 0.30 m.  The 0.35 m
  # container safety margin remains active, so the physical surface-to-base
  # clearance is 1.00 + 0.35 = 1.35 m.
  fridge_standoff_m: 1.00
  # M1 must authorize the refrigerator front/door face before an open
  # command. Do not use the current robot-side radial pose as the action pose.
  container_m1_face_selection_enabled: true
  container_pre_action_mllm: true
  # Direct fridge interaction means the published subgoal, M1 capture pose,
  # and physical action pose must be the same point.  Leaving this false
  # sends the robot to the legacy safe_farthest staging ring, making the
  # visible subgoal appear unchanged even when fridge_standoff_m is reduced.
  container_anchor_shared_pose_enabled: true
  fridge_direct_interaction_on_arrival: false
  # Treat arrival at the refrigerator interaction subgoal as sufficient for
  # invoking the physical bridge; do not spend another navigation/M1 cycle.
  fridge_direct_interaction_on_arrival: true
  interaction_safety_margin_m: 0.35
  # Do not enter the human-interaction policy while the base is still visibly
  # misaligned with the door normal.
  interaction_ready_yaw_tolerance_rad: 0.15
executor:
  # After the fixed post-open traversal point is reached, observe both sides
  # of the newly opened doorway before returning to normal exploration.
  post_interaction_exit_observation_enabled: true
  post_interaction_exit_observation_angle_rad: 1.5707963
  post_interaction_exit_observation_speed_rad_s: 0.30
  post_interaction_exit_observation_tolerance_rad: 0.12
  post_interaction_exit_observation_settle_s: 0.5
  post_interaction_exit_observation_view_timeout_s: 6.0
  post_interaction_exit_observation_return_home: true
  # Enable the semantic executor's collision-checked in-place turn whenever
  # the selected goal lies behind the robot. DWA's independent rear-path
  # branch remains disabled to avoid issuing two competing yaw commands.
  rear_goal_prerotate_enabled: true
  # The physical bridge has no simulator step-sync/fresh-command acknowledgement.
  # Close the loop from live odometry instead of waiting forever for one.
  rear_goal_prerotate_step_sync_enabled: false
  # Unlike simulator exploration, keep a physical frontier goal active while
  # DWA performs its collision-checked terminal rotation.
  explore_terminal_yaw_enabled: true
  explore_terminal_xy_tolerance_m: 0.30
  explore_terminal_yaw_tolerance_rad: 0.15
  # Four center-line distances plus two lateral fallbacks remain within one
  # committed door attempt.  A local-planner stagnation advances to the next
  # pose instead of marking the complete door candidate unreachable.
  interaction_approach_fallback_max_attempts: 6
  # After M3 success and causal costmap refresh, allow the global planner time
  # to accept the newly cleared short door-crossing waypoint.
  post_interaction_traversal_make_plan_retry_window_s: 2.0
  post_interaction_traversal_make_plan_retry_interval_s: 0.10
  # Once a raw SLAM OCC receipt follows the open result, the physical global
  # costmap is sufficient to trigger make_plan; do not wait for the slower
  # semantic planning-OCC relay before crossing the door.
  post_interaction_costmap_fast_path_enabled: true
  # The physical action server is launched alongside the semantic stack.  Do
  # not hold a navigation worker for the simulator's 30-second startup wait
  # when that server is temporarily absent during a restart.
  move_base_server_wait_s: 5.0
  # Bound an unavailable make_plan service check in the physical lane.  The
  # causal OCC barrier remains authoritative; this only prevents a stale
  # service wait from delaying the first post-open traversal attempt.
  make_plan_service_wait_sec: 0.5
exploration:
  # ExplorePy is an external-goal producer in the physical lane.  Its
  # periodic make_plan/recovery preflights otherwise compete with the
  # executor-owned post-open causal replan and can keep move_base busy while
  # the new OCC is already available.
  external_recovery_preflight_enabled: false
  make_plan_preflight_enabled: false
policy:
  # The executor owns the physical raw-OCC -> global-costmap causal barrier.
  # Do not add a second 30 s semantic-graph freshness gate before it.
  post_interaction_refresh_enabled: false
  # An M3 timeout skips the unchanged physical object briefly, then allows it
  # to become eligible again after the robot has explored another subgoal.
  interaction_target_failure_cooldown_s: 30.0
frontier:
  # Physical-only subgoal clearance. At 0.1 m OCC resolution this requires at
  # at least eight clear cells from an occupied endpoint, while the footprint check
  # separately reserves the Go2 body radius plus margin.
  min_obstacle_clearance_m: 0.80
  max_clearance_check_m: 1.80
  robot_radius_m: 0.25
  footprint_safety_margin_m: 0.30
  turning_safety_margin_m: 0.20
  require_footprint_free: true
  require_turning_clearance: true
model:
  mode: "http"
  endpoint: "http://127.0.0.1:18080/v1"
  model: "qwen3.6-35b-a3b-fp8"
  protocol: "openai_chat"
  # Keep post-interaction replanning responsive on the physical MLLM lane.
  timeout_s: 8.0
  max_tokens: 256
  metrics_path: "/tmp/physical_nav_mllm.jsonl"
  subgoal_interaction_semantic_types: ["door", "fridge"]
