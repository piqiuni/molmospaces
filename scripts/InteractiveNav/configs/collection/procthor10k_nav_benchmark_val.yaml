source:
  kind: nav_benchmark
  scene_dataset: procthor-10k
  data_split: val
  benchmark_path: assets/benchmarks/molmospaces-bench-v2/procthor-10k/NavToObjDataGenConfig/NavToObjProcthor10kBench_20260112_json_benchmark/benchmark.json
  houses: all
  variant: base
  missing_scene_policy: fail

collection:
  mode: light
  schema_version: interactive_nav_v3
  open_gt_control: false
  synthetic_wrong_action_rollout: false

balance:
  strategy: strict_valid_episode_count
  total_samples: 100
  domain_order: [channel, container, mixed]
  max_samples_per_house:
    channel: 2
    container: 2
    mixed: 3

policy:
  navigation_executor: astar
  channel:
    executor: force
  container:
    executor: force

runtime:
  workers: 4
  seed: 20260721
  resume: true
  mujoco_gl: egl
  save_images: false
  save_plots: false

output:
  root: scripts/InteractiveNav/output/interactive_nav_v3_nav_benchmark_val
