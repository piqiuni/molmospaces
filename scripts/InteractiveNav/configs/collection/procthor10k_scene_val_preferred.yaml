source:
  kind: scene_split
  scene_dataset: procthor-10k
  data_split: val
  houses: all
  variant: base
  preferred_object_categories: [book, cellphone, cup, remotecontrol]
  preferred_object_names: []
  min_start_goal_distance_m: 3.0
  max_start_goal_distance_m: 15.0
  prefer_longest_start_goal: true
  seeds_per_house: 4
  seed_candidate_pool: 4096
  missing_scene_policy: fail

collection:
  mode: light
  schema_version: interactive_nav_v3
  open_gt_control: false
  synthetic_wrong_action_rollout: false

balance:
  strategy: strict_valid_episode_count
  total_samples: 100
  domain_order: [channel, container, mixed]
  max_samples_per_house:
    channel: 2
    container: 2
    mixed: 3

policy:
  navigation_executor: astar
  channel:
    executor: force
  container:
    executor: force

runtime:
  workers: 4
  seed: 20260721
  resume: true
  mujoco_gl: egl
  save_images: false
  save_plots: false

output:
  root: scripts/InteractiveNav/output/interactive_nav_v3_scene_val_preferred
