# Habitat Challenge 2023 ObjectNav-v2 profile using the complete ROS semantic
# mapping/candidate pipeline.  Only the model perception backend is replaced by
# YOLOE; Module-3 is a fail-closed ObjectGoal STOP verifier and has no
# interaction executor or interaction output.
schema_version: 1
profile: habitat-objectnav-v2-full-ros-graph-m2-navigation-only

official_task_assertions:
  habitat_config: benchmark/nav/objectnav/objectnav_v2_hm3d_stretch.yaml
  distance_to: VIEW_POINTS
  success_distance_m: 0.1
  requires_explicit_stop: true

modules:
  module1:
    enabled: true
    mode: full_ros_navigation_stack
    sidecar:
      transport: http_sidecar
      endpoint: http://127.0.0.1:12230
      timeout_s: 25.0
      interval_steps: 5
      min_confidence: 0.35
      include_depth: true
      original_module1_scripts: /home/ldl/molmospaces-exp-setting/Interactive-Nav-SG-nav/src/semantic_mapping_py_pkg/scripts
      require_healthy: true

  module2:
    enabled: true
    mode: original_model_policy
    endpoint: http://127.0.0.1:8000/v1
    model: qwen3.6-35b-a3b-fp8
    timeout_s: 30.0
    vision_localization_enabled: false

  module3:
    enabled: true
    mode: objectgoal_stop_verified
    fail_closed: true
    allowed_outputs: [STOP, CONTINUE, RESCAN]
    stop_trigger_distance_m: 0.25
    detector_confirmations: 2
    min_confidence: 0.80
    allowed_behavior_types: [EXPLORE, NAVIGATE]
    forbidden_behavior_types: [INTERACT]
    forbidden_habitat_actions: [INTERACT, OPEN, CLOSE]

approach:
  min_depth_m: 0.20
  max_target_depth_m: 4.0
  waypoint_standoff_m: 0.60
  waypoint_reached_distance_m: 0.08
  max_contiguous_steps: 120
  target_track_standoff_m: 1.00
  route_goal_reached_distance_m: 0.10

stop_proxy:
  # Disable the legacy direct RGB-D proxy. STOP is owned by the fail-closed M3
  # gate above; Habitat still evaluates the official VIEW_POINTS<=0.1m measure.
  enabled: false
  habitat_action: velocity_stop
  depth_m: 0.60
  center_tolerance: 0.18
  confirmations: 2

logging:
  public_trace: true
