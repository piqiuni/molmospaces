mission:
  mode: "semantic_interaction_object_goal"

ablation:
  module1: "dynamic_rule"
  module2: "mllm_score"
  module3: "rule_verified"

target:
  enabled: true
  target_name: "apple"
  object_labels: ["apple"]
  standoff_m: 0.75
  require_interaction: false
  require_current_visibility: false
  completion_requires_visibility: true
  min_visible_pixels: 16

candidate:
  interaction_types: ["portal", "container"]
  target_require_current_visibility: false
  target_require_same_room: true
  target_allow_connected_room: true
  target_min_visible_pixels: 16

policy:
  backend: "model"
  failure_cooldown_s: 30.0
  failure_cooldown_schedule_s: [30.0, 60.0, 180.0]
  failure_retry_delay_s: 1.0
  repeat_guard_enabled: true
  repeat_guard_low_gain_limit: 2
  repeat_guard_min_frontier_shrink_m: 0.15

model:
  selection_granularity: "candidate"
  candidate_top_k: 8
  navigate_quota: 1
  interaction_quota: 3
  explore_quota: 4
  max_frontiers_per_room: 2
  max_candidates_per_region: 1
  history_region_size_m: 1.0
  stale_goal_position_tolerance_m: 0.35
  stale_goal_yaw_tolerance_rad: 0.50
  timeout_s: 3.0
  max_tokens: 256
  consecutive_timeout_limit: 2
  timeout_cooldown_s: 60.0
