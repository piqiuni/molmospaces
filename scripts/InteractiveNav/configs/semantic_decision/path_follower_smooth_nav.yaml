latch_xy_goal_tolerance: true

GlobalPlanner:
  allow_unknown: false
  orientation_mode: 0
  orientation_window_size: 8

PathFollower:
  lookahead_m: 0.26
  max_path_deviation_m: 0.18
  control_dt_s: 0.20
  max_vel_x: 0.42
  max_vel_theta: 1.25
  acc_lim_x: 2.5
  acc_lim_theta: 1.2
  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.20
  turn_in_place_threshold: 0.70

global_costmap:
  transform_tolerance: 3.0
  update_frequency: 10.0
  publish_frequency: 10.0

local_costmap:
  transform_tolerance: 3.0
  width: 6.0
  height: 6.0
