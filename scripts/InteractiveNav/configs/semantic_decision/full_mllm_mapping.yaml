ablation:
  module1: "dynamic_mllm"
  module2: "mllm_score"
  module3: "mllm_skill_verified"

# The V3 launcher starts interaction_attribute_inference_node when
# semantic_attribute_inference=true.  Its second, independent lane consumes
# room + in-room object metadata only (no RGB/crop).
room_mllm:
  enabled: true
  # Long simulator object IDs can make the compact evidence list exceed the
  # historical 96-token cap.  This lane is text-only and independently queued,
  # so raise only its budget; successful results are then cached rather than
  # retried on every mapping refresh.
  max_output_tokens: 192
