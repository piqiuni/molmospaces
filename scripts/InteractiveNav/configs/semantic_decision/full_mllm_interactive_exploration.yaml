ablation:
  module1: "dynamic_mllm"
  module2: "mllm_score"
  module3: "mllm_skill_verified"

target:
  enabled: false

candidate:
  interaction_types: ["portal", "container"]
  # Do not let the label-derived Door prior issue an interaction before the
  # visual attribute module has returned a ready result.
  require_current_visibility: false
  max_state_age_sec: 3600.0
  # Preserve remembered containers as global planning candidates. A fresh M1
  # view is required only immediately before execution, never to erase the
  # global candidate from Module 2.
  container_require_same_room: false
  container_allow_connected_room: true
  portal_standoff_m: 0.85
  # ``_approach_pose`` already starts from the observed AABB surface.  Keep
  # drawers close enough for the scan macro, but use a type-specific larger
  # refrigerator clearance because its hinged leaf sweeps toward the robot.
  container_standoff_m: 0.40
  drawer_standoff_m: 0.40
  fridge_standoff_m: 0.80
  # M1 is sampled at an outer staging pose, then the executor navigates to its
  # paired inner type-safe action pose before the bridge command.  The drawer
  # macro retains the action regions from that outer visual observation.
  container_observation_standoff_m: 0.70
  drawer_observation_standoff_m: 0.65
  fridge_observation_standoff_m: 0.80
  # Try three four-sided outer staging rings.  Widening the M1-only arrival
  # envelope by 5 cm is paired with 5 cm more outer clearance, while the inner
  # bridge gate remains the separate container_interaction distance below.
  container_safe_staging_outer_offset_m: 0.35
  container_safe_staging_ring_count: 3
  # Match the finite 3 x 4 outer staging ring: each fresh M1 rejection may
  # advance to another safe view, but never creates an unbounded loop.
  container_two_stage_observation_max_attempts: 12
  # This is pose error around the outer M1 staging target, never permission to
  # execute there.  The paired .35 m offset preserves its closest clearance.
  container_safe_staging_arrival_tolerance_m: 0.30
  container_interaction_ready_distance_m: 0.25
  interaction_safety_margin_m: 0.10
  interaction_ready_distance_m: 0.30
  interaction_ready_yaw_tolerance_rad: 0.35

policy:
  backend: "model"
  portal_bonus: 0.55
  container_bonus: 1.0
  interaction_cost_weight: 0.30
  nearby_interaction_radius_m: 1.5
  nearby_interaction_bonus: 1.5
  interaction_priority_bonus: 2.0
  failure_cooldown_s: 5.0
  interaction_target_failure_cooldown_s: 60.0
  failure_retry_delay_s: 1.0
  repeat_guard_enabled: true
  repeat_guard_low_gain_limit: 2
  repeat_guard_min_frontier_shrink_m: 0.15

model:
  # The local Qwen service may data-parallel across both GPUs; 12 s keeps a
  # large real-navigation margin
  # while preventing a stalled endpoint from freezing a scene for 30 seconds.
  timeout_s: 12.0
  # Module 2 normally returns a tiny ranking.  Keep enough headroom to recover
  # from a local Qwen response that starts to serialize long candidate context
  # instead of silently truncating its JSON and falling back to rules.
  max_tokens: 384
  consecutive_timeout_limit: 2
  timeout_cooldown_s: 60.0
  skill_timeout_s: 12.0
  skill_max_output_tokens: 256
  verification_timeout_s: 12.0
  # Visual verification has a strict, compact JSON schema, but reserve enough
  # completion headroom so a local MLLM cannot cut off the enclosing object.
  verification_max_output_tokens: 256

completion:
  empty_candidate_confirmations: 3
  stagnation_failure_limit: 8

executor:
  interaction_navigation_timeout_s: 180.0
  interaction_observation_timeout_s: 12.0
  # A two-stage container has a finite twelve-pose M1 staging sequence; retain
  # that bounded coverage after an inner action-pose failure.
  container_two_stage_fallback_max_attempts: 12
  # M1 is sampled at the outer safe staging pose.  A single strict direct-front
  # observation is enough to enter the paired inner action pose; the simulator
  # still checks the public pose contract and refrigerator sweep before force.
  container_pre_action_confirmation_count: 1
  # Full-MLLM runs use the same safe rear-navigation controller as the rule
  # lane: a fresh local-grid sweep chooses and locks a turn side before DWA.
  rear_goal_enter_angle_rad: 1.5707963267948966
  # Leave room for a costmap-safe wrapped opposite turn when the shortest
  # direction is blocked; the action count remains finite and step-synced.
  rear_goal_prerotate_max_control_steps: 28
  rear_goal_prerotate_post_budget_settle_steps: 3
  rear_goal_local_costmap_max_age_s: 0.75
  rear_goal_robot_radius_m: 0.25
  rear_goal_safety_margin_m: 0.05
  # Do not turn ordinary inflation costs into hard obstacles in the executor;
  # only costmap inscribed/lethal cells block the radius-aware safety sweep.
  rear_goal_costmap_occupied_threshold: 253
  rear_goal_unknown_is_blocked: true
  rear_goal_rotation_sweep_step_rad: 0.10
  rear_goal_oscillation_window_steps: 4
  rear_goal_oscillation_min_sign_flips: 2
  rear_goal_oscillation_max_displacement_m: 0.05
  rear_goal_reverse_distance_m: 0.15
  rear_goal_reverse_min_distance_m: 0.05
  rear_goal_reverse_speed_mps: 0.10
  rear_goal_reverse_max_control_steps: 10
  # Keep generic final-align disabled in the base config: only an INTERACT
  # approach may rotate in place at its public bridge-ready standoff.
  interaction_final_align_enabled: true
  interaction_final_align_max_distance_m: 0.35
  interaction_final_align_yaw_tolerance_rad: 0.15
  interaction_final_align_rotate_speed_rad_s: 0.30
  interaction_final_align_timeout_s: 15.0
  interaction_final_align_step_sync_enabled: true
  interaction_final_align_control_dt_s: 0.2
  # Hard cap only; the actual count is derived from yaw error, .30 rad/s,
  # .20 s fixed simulator actions, and the .15 rad terminal tolerance.
  interaction_final_align_max_control_steps: 56
  interaction_final_align_control_step_margin_steps: 4
  interaction_final_align_post_budget_settle_steps: 3
  interaction_final_align_step_sync_stall_timeout_s: 2.0
  interaction_final_align_delivery_retry_steps: 2
